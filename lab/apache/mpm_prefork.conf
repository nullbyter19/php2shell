# A single worker. Not for performance: to guarantee that the producer request
# and the consumer request are served by the SAME process.
#
# This file is what makes the demo deterministic. In production, with
# MaxRequestWorkers>1, the same chain becomes a probabilistic race — an important
# point in the talk.

<IfModule mpm_prefork_module>
    ServerLimit              1
    StartServers             1
    MinSpareServers          1
    MaxSpareServers          1
    MaxRequestWorkers        1
    MaxConnectionsPerChild   0
</IfModule>
