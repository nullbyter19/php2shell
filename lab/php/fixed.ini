; Control: 8.5.12 with the SAME configuration as the target.
; If the behaviour difference comes from the version and not from ini settings,
; this file must be identical to vuln.ini field by field.

memory_limit = 128M
post_max_size = 8M
max_file_uploads = 20
max_input_nesting_level = 64
max_execution_time = 30

session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = PHP_SESSION_UPLOAD_PROGRESS
session.use_strict_mode = 0
session.use_only_cookies = 1
session.save_path = "/tmp"

fatal_error_backtraces = On

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

opcache.enable = 0
