; Target 8.5.11 configuration — deliberately close to defaults, with the values
; the talk mentions explicitly.
;
; Everything here is a "reasonable shared-hosting default": nothing exotic that
; would make the attack easier.

memory_limit = 128M
post_max_size = 8M
max_file_uploads = 20
max_input_nesting_level = 64
max_execution_time = 30

; --- surface relevant to CVE-2026-109619 -------------------------------------
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = PHP_SESSION_UPLOAD_PROGRESS
session.use_strict_mode = 0
session.use_only_cookies = 1
session.save_path = "/tmp"

; Confirmed advisory path on PHP 8.5 (fatal error backtrace).
fatal_error_backtraces = On

; Diagnostics visible: the talk shows why hiding these mitigates nothing.
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

; Keep OPcache out of the equation at this stage.
opcache.enable = 0
