# PHP2Shell — lab Apache.
#
# Mounted at /etc/apache2/conf-enabled/zz-p2s.conf. Debian's apache2.conf reads
# mods-enabled/*.conf BEFORE conf-enabled/*.conf, so the block below beats the
# image's original mpm_prefork.conf (which brings MaxRequestWorkers 150).
#
# Why 1 worker: the chain needs the "producer" request (which publishes state and
# dies) and the "consumer" one (which reads the dead state) to land in the SAME
# process. In production that is a race with 150 workers; here it is invariant.
# It is the only configuration deviation that exists to make the demo
# deterministic.

# No keep-alive: a reused connection holds the worker and gets in the way of the
# toolkit's request sequencing.
KeepAlive Off

<IfModule mpm_prefork_module>
    ServerLimit              1
    StartServers             1
    MinSpareServers          1
    MaxSpareServers          1
    MaxRequestWorkers        1
    MaxConnectionsPerChild   0
</IfModule>

# The docroot is writable by www-data in the lab (it is where the `id>p1` proof
# lands). This is a lab precondition, not a recommendation.
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
