; PHP2Shell — target configuration (php:8.5.11-apache).
;
; Every line below exists because the chain needs it. These are the preconditions
; that the advisory and the public research describe — the "honest weak
; configuration" of a lab, not a recommendation for production.
;
; Mounted at /usr/local/etc/php/conf.d/zz-p2s.ini (the last .ini wins).

; --- the OOM trigger -------------------------------------------------------
; A low memory_limit is what lets ONE multipart request die in the middle of the
; parse. Stage 1 posts memory_limit + ~12 MiB of body.
memory_limit = 8M

; post_max_size has to stay ABOVE memory_limit + 12M, otherwise PHP rejects the
; body before parsing and the chain dies at the door. The 8M default blocks it.
post_max_size = 512M
upload_max_filesize = 512M
max_file_uploads = 20
max_execution_time = 30
max_input_vars = 1000

; --- visible diagnostics ----------------------------------------------------
; The stage 1 leak is read from the fatal error PHP renders. display_errors=Off
; kills that path (hardening removes THIS path, it does not close the bug).
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; The stage 3 layout was calibrated with expose_php=On: turning it off shifts the
; startup heap and the pads that come with the toolkit no longer fit.
expose_php = On

; Backtrace on fatal error (path confirmed in the advisory for PHP 8.5).
fatal_error_backtraces = On

; --- the surface of the bug -------------------------------------------------
; session.upload_progress runs BEFORE zend_activate_modules()/RINIT, that is,
; before the request initialization. That is why the application does not need a
; single line of session code for the callback to fire.
;
; Do NOT override session.upload_progress.prefix or .name. The chain sends the
; POST field "PHP_SESSION_UPLOAD_PROGRESS" (which is the default .name) and
; expects the key $_SESSION["upload_progress_" . value] — in other words, the
; DEFAULT prefix. Changing the prefix shifts the session key by 23 bytes,
; changes the size of the serialized data and stage 1 (heap leak) fails on every
; attempt.
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.use_strict_mode = 0
session.use_only_cookies = 1
session.use_cookies = 1
session.save_path = "/tmp"

; --- miscellaneous ------------------------------------------------------------------------------------------------------------------
; OPcache ON — this is how the profile was measured.
;
; The official image already ships OPcache active (docker-php-ext-enable
; opcache) and php-8.5.11-bookworm-amd64 was calibrated in that state. With
; opcache.enable=0, index.php is compiled on the request heap instead of coming
; from SHM: the startup heap changes and stage 1's field N stops landing in the
; right block — HEAP_LEAK_FAILED on all 3 attempts, even with the rest of the
; configuration correct.
opcache.enable = 1
date.timezone = UTC
